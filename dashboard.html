<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2f5eea" />
  <title>Panini Tracker · Dashboard</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="wrap">
    <header class="top">
      <h1 id="welcome"></h1>
      <div class="top-actions">
        <button id="btnCompare" class="ghost small-btn">Confronta album</button>
        <button id="btnLogout" class="ghost small-btn">Logout</button>
      </div>
    </header>

    <section class="card">
      <div class="card-header">
        <h2>I tuoi album</h2>
        <button id="btnNewAlbum" class="primary new-album-btn">+ Nuovo album</button>
      </div>
      <div id="albumsList" class="list"></div>
    </section>

    <section class="card">
      <div class="card-header">
        <h2>Album di amici</h2>
        <div class="action-buttons">
          <button id="btnImportAlbum" class="ghost small-btn">Importa album</button>
          <input id="importFile" type="file" accept="application/json" class="hidden" />
        </div>
      </div>
      <div id="friendAlbumsList" class="list"></div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <div id="importModal" class="modal hidden">
    <div class="modal-content">
      <h3>Importa album</h3>
      <div class="modal-body">
        <div><strong>Album:</strong> <span id="modalAlbumName"></span></div>
        <div><strong>Proprietario:</strong> <span id="modalOwner"></span></div>
        <div><strong>Figurine totali:</strong> <span id="modalTotal"></span></div>
        <div><strong>Ce l’ho:</strong> <span id="modalOwned"></span></div>
        <div><strong>Mancanti:</strong> <span id="modalMissing"></span></div>
        <div><strong>Doppie:</strong> <span id="modalDup"></span></div>
        <p class="muted small" style="margin-top:8px;">L'album verrà aggiunto come “Album di un amico” e non modificherà i tuoi album.</p>
      </div>
      <div class="modal-actions">
        <button id="btnCancelImport" class="ghost small-btn">Annulla</button>
        <button id="btnConfirmImport" class="primary small-btn">Importa</button>
      </div>
    </div>
  </div>

  <div id="createModal" class="modal hidden">
    <div class="modal-content">
      <h3>Nuovo album</h3>
      <div class="modal-body">
        <div class="field">
          <label for="modalCreateName">Nome</label>
          <input id="modalCreateName" type="text" placeholder="Es. Calciatori 2025/26" />
        </div>
      </div>
      <div class="modal-actions">
        <button id="btnCancelCreate" class="ghost small-btn">Annulla</button>
        <button id="btnConfirmCreate" class="primary small-btn">Crea</button>
      </div>
    </div>
  </div>

  <script src="./storage.js"></script>
  <script src="./pwa.js"></script>
  <script src="./dashboard.js"></script>
</body>
</html>
