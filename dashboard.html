<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panini Tracker · Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <header class="top">
      <h1 id="welcome"></h1>
      <button id="btnLogout" class="ghost small-btn">Logout</button>
    </header>

    <section class="card">
      <h2>I tuoi album</h2>
      <div id="albumsList" class="list"></div>
    </section>

    <section class="card">
      <h2>Album di amici</h2>
      <div id="friendAlbumsList" class="list"></div>
    </section>

    <section class="card">
      <h2>Crea un album</h2>
      <div class="field">
        <label for="albumName">Nome</label>
        <input id="albumName" type="text" placeholder="Es. Calciatori 2025/26" />
      </div>
      <button id="btnCreateAlbum" class="primary">Crea</button>
      <div class="actions single" style="margin-top:10px;">
        <button id="btnImportAlbum" class="ghost">Importa album</button>
        <input id="importFile" type="file" accept="application/json" class="hidden" />
      </div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <div id="importModal" class="modal hidden">
    <div class="modal-content">
      <h3>Importa album</h3>
      <div class="modal-body">
        <div><strong>Album:</strong> <span id="modalAlbumName"></span></div>
        <div><strong>Proprietario:</strong> <span id="modalOwner"></span></div>
        <div><strong>Figurine totali:</strong> <span id="modalTotal"></span></div>
        <div><strong>Ce l’ho:</strong> <span id="modalOwned"></span></div>
        <div><strong>Mancanti:</strong> <span id="modalMissing"></span></div>
        <div><strong>Doppie:</strong> <span id="modalDup"></span></div>
        <p class="muted small" style="margin-top:8px;">L'album verrà aggiunto come “Album di un amico” e non modificherà i tuoi album.</p>
      </div>
      <div class="modal-actions">
        <button id="btnCancelImport" class="ghost small-btn">Annulla</button>
        <button id="btnConfirmImport" class="primary small-btn">Importa</button>
      </div>
    </div>
  </div>

  <script src="storage.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
