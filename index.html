<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2f5eea" />
  <title>Panini Tracker · Login</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="wrap">
    <header class="top">
      <h1>Panini Tracker</h1>
      <p class="muted">Seleziona un profilo oppure creane uno nuovo</p>
    </header>

    <section class="card">
      <h2>Accedi</h2>
      <div class="field">
        <label for="profileSelect">Profili esistenti</label>
        <select id="profileSelect"></select>
      </div>
      <div id="noProfilesMsg" class="muted small hidden">Nessun profilo trovato. Crea un profilo per iniziare.</div>
      <button id="btnLogin" class="primary">Login</button>
    </section>

    <section class="card">
      <h2>Nuovo profilo</h2>
      <div class="field">
        <label for="newProfileName">Nome profilo</label>
        <input id="newProfileName" type="text" placeholder="Es. Alberto" />
      </div>
      <button id="btnCreateLogin">Crea &amp; accedi</button>
      <div class="actions single" style="margin-top:10px;">
        <button id="btnImportProfile" class="ghost">Importa profilo</button>
        <input id="profileImportFile" type="file" accept="application/json" class="hidden" />
      </div>
    </section>

    <section class="card">
      <h2>Gestisci profili</h2>
      <div id="profilesList" class="list"></div>
    </section>

    <div id="profileImportModal" class="modal hidden">
      <div class="modal-content">
        <h3>Importa profilo</h3>
        <div class="modal-body">
          <div><strong>Profilo:</strong> <span id="impProfileName"></span></div>
          <div><strong>ID:</strong> <span id="impProfileId"></span></div>
          <div><strong>Album:</strong> <span id="impAlbumCount"></span></div>
          <div><strong>Totale figurine possedute:</strong> <span id="impOwned"></span></div>
        </div>
        <div class="modal-actions">
          <button id="btnCancelProfileImport" class="ghost small-btn">Annulla</button>
          <button id="btnConfirmProfileImport" class="primary small-btn">Importa</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
  </main>

  <script src="./storage.js"></script>
  <script src="./pwa.js"></script>
  <script src="./login.js"></script>
</body>
</html>
